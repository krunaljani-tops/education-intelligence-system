services:
  # Backend FastAPI Web Service
  - type: web
    name: education-bi-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: education-bi-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: EXCEL_FILE_PATH
        value: 02_Education.xlsx

databases:
  # Managed PostgreSQL Database
  - name: education-bi-postgres
    databaseName: education_bi
    user: education_admin
    region: oregon
    plan: free
